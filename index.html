<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stars Battle</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --accent: #e52e2e;
            --star-color: #ffb800; /* Цвет Telegram Stars */
            --star-glow: rgba(255, 184, 0, 0.3);
            --text-main: #ffffff;
            --text-muted: #8b8b93;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Шапка с балансом */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: var(--card-bg);
            border-bottom: 1px solid #2a2a35;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .balance {
            font-size: 20px;
            font-weight: bold;
            color: var(--star-color);
            display: flex;
            align-items: center;
            gap: 5px;
            text-shadow: 0 0 10px var(--star-glow);
        }

        /* Игровая зона */
        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .case-image {
            width: 160px;
            height: 160px;
            background: linear-gradient(135deg, #2a2a35, #1e1e24);
            border: 2px solid var(--star-color);
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 90px;
            margin-bottom: 30px;
            box-shadow: 0 0 40px var(--star-glow);
            transition: transform 0.2s;
            position: relative;
        }
        
        /* Свечение вокруг кейса */
        .case-image::after {
            content: '';
            position: absolute;
            width: 100%; height: 100%;
            border-radius: 25px;
            box-shadow: inset 0 0 20px rgba(255,255,255,0.1);
        }

        .case-image:active {
            transform: scale(0.95);
        }

        /* Рулетка */
        .roulette-container {
            width: 100%;
            height: 120px;
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            border: 1px solid #2a2a35;
            margin-bottom: 30px;
            display: none;
        }

        .roulette-container::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--star-color);
            transform: translateX(-50%);
            z-index: 10;
            box-shadow: 0 0 15px var(--star-color);
        }

        .roulette-track {
            display: flex;
            height: 100%;
            align-items: center;
            position: absolute;
            left: 0;
            transition: transform 4.5s cubic-bezier(0.1, 0.7, 0.1, 1);
        }

        .roulette-item {
            width: 100px;
            height: 90px;
            margin: 0 10px;
            background: #2a2a35;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border-bottom: 3px solid #555;
        }

        .roulette-item.jackpot { border-bottom-color: var(--star-color); box-shadow: 0 5px 15px var(--star-glow); }
        .roulette-item.rare { border-bottom-color: #a855f7; }
        .roulette-item.common { border-bottom-color: #3b82f6; }

        .roulette-item .emoji { font-size: 30px; margin-bottom: 5px; }
        .roulette-item .price { font-size: 14px; font-weight: bold; color: var(--star-color); }

        /* Кнопки */
        .btn {
            background: linear-gradient(90deg, #ffb800, #ff9500);
            color: #000;
            border: none;
            padding: 16px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            width: 100%;
            max-width: 320px;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s, transform 0.1s;
            box-shadow: 0 4px 20px var(--star-glow);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn:disabled {
            background: #555;
            color: #888;
            box-shadow: none;
            opacity: 0.7;
        }

        .btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        /* Результат */
        .result-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(18, 18, 20, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            backdrop-filter: blur(5px);
        }

        .result-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .result-card {
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 25px;
            text-align: center;
            border: 2px solid var(--star-color);
            box-shadow: 0 0 50px var(--star-glow);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 85%;
            max-width: 300px;
        }

        .result-overlay.active .result-card {
            transform: scale(1);
        }

        .result-emoji { font-size: 70px; margin-bottom: 15px; text-shadow: 0 0 20px var(--star-glow); }
        .result-title { font-size: 22px; margin-bottom: 10px; color: var(--star-color); font-weight: bold; }
        .result-price { font-size: 20px; color: white; margin-bottom: 25px; font-weight: bold; }

        /* Уведомление о нехватке звезд */
        .toast {
            position: absolute;
            top: 80px;
            background: rgba(229, 46, 46, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            transform: translateY(-50px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 30;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <div class="header">
        <div class="user-info">
            <div class="avatar">👤</div>
            <div id="username" style="font-weight: bold;">Игрок</div>
        </div>
        <div class="balance">
            <span id="balance-amount">50</span> <span style="font-size: 24px;">⭐</span>
        </div>
    </div>

    <!-- Игровая зона -->
    <div class="game-area">
        
        <div class="toast" id="toast">Недостаточно звезд!</div>

        <!-- Кейс -->
        <div class="case-image" id="case-icon">🎁</div>
        
        <!-- Рулетка -->
        <div class="roulette-container" id="roulette">
            <div class="roulette-track" id="track"></div>
        </div>

        <!-- Кнопка -->
        <button class="btn" id="spin-btn">
            <span>Открыть кейс</span>
            <span style="font-size: 16px;">(10 ⭐)</span>
        </button>

        <!-- Оверлей результата -->
        <div class="result-overlay" id="result-overlay">
            <div class="result-card">
                <div class="result-emoji" id="res-emoji">⭐</div>
                <div class="result-title" id="res-title">Победа!</div>
                <div class="result-price" id="res-price">+10 ⭐</div>
                <button class="btn" id="close-result" style="padding: 12px 20px; font-size: 16px; box-shadow: none;">Забрать</button>
            </div>
        </div>

    </div>

    <script>
        // ================= ЛОГИКА ИГРЫ =================
        
        let tg = window.Telegram.WebApp;
        tg.expand(); 
        
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('username').innerText = tg.initDataUnsafe.user.first_name;
        }

        // Призы в звездах
        const prizes = [
            { name: "5 звезд", value: 5, emoji: "⭐", weight: 50, class: "common" },
            { name: "15 звезд", value: 15, emoji: "🌟", weight: 30, class: "common" },
            { name: "50 звезд", value: 50, emoji: "💫", weight: 15, class: "rare" },
            { name: "150 звезд", value: 150, emoji: "✨", weight: 4, class: "rare" },
            { name: "500 звезд", value: 500, emoji: "🌠", weight: 1, class: "jackpot" }
        ];

        const CASE_PRICE = 10; // Стоимость кейса в звездах
        let balance = 50; // Стартовый баланс
        let isSpinning = false;

        const balanceEl = document.getElementById('balance-amount');
        const spinBtn = document.getElementById('spin-btn');
        const trackEl = document.getElementById('track');
        const rouletteEl = document.getElementById('roulette');
        const caseIcon = document.getElementById('case-icon');
        const toast = document.getElementById('toast');
        
        const resultOverlay = document.getElementById('result-overlay');
        const resEmoji = document.getElementById('res-emoji');
        const resTitle = document.getElementById('res-title');
        const resPrice = document.getElementById('res-price');

        function updateBalance() {
            balanceEl.innerText = balance;
        }

        function getRandomPrize() {
            const totalWeight = prizes.reduce((sum, p) => sum + p.weight, 0);
            let random = Math.random() * totalWeight;
            for (let prize of prizes) {
                if (random < prize.weight) return prize;
                random -= prize.weight;
            }
            return prizes[0];
        }

        function generateTrack(winningPrize) {
            trackEl.innerHTML = '';
            
            for (let i = 0; i < 50; i++) {
                const p = prizes[Math.floor(Math.random() * prizes.length)];
                const item = document.createElement('div');
                item.className = `roulette-item ${p.class}`;
                item.innerHTML = `<div class="emoji">${p.emoji}</div><div class="price">${p.value} ⭐</div>`;
                trackEl.appendChild(item);
            }

            const winItem = document.createElement('div');
            winItem.className = `roulette-item ${winningPrize.class}`;
            winItem.innerHTML = `<div class="emoji">${winningPrize.emoji}</div><div class="price">${winningPrize.value} ⭐</div>`;
            
            const items = trackEl.children;
            if(items.length > 45) {
                trackEl.replaceChild(winItem, items[45]);
            }
        }

        // Показ ошибки, если нет денег
        function showToast() {
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
        }

        spinBtn.addEventListener('click', () => {
            if (isSpinning) return;
            if (balance < CASE_PRICE) {
                showToast();
                return;
            }

            isSpinning = true;
            spinBtn.disabled = true;
            
            balance -= CASE_PRICE;
            updateBalance();

            caseIcon.style.display = 'none';
            rouletteEl.style.display = 'block';
            
            trackEl.style.transition = 'none';
            trackEl.style.transform = `translateX(0px)`;

            const winningPrize = getRandomPrize();
            generateTrack(winningPrize);

            setTimeout(() => {
                trackEl.style.transition = 'transform 4.5s cubic-bezier(0.1, 0.7, 0.1, 1)';
                
                const itemWidth = 120; 
                const targetIndex = 45; 
                const containerWidth = rouletteEl.offsetWidth;
                const randomOffset = Math.floor(Math.random() * 60) - 30;
                
                const translateX = -(targetIndex * itemWidth) + (containerWidth / 2) - (itemWidth / 2) + randomOffset;
                
                trackEl.style.transform = `translateX(${translateX}px)`;

                setTimeout(() => {
                    balance += winningPrize.value;
                    updateBalance();
                    showResult(winningPrize);
                }, 4600);

            }, 50);
        });

        function showResult(prize) {
            resEmoji.innerText = prize.emoji;
            resTitle.innerText = prize.name;
            resPrice.innerText = `+${prize.value} ⭐`;
            
            if(prize.class === 'jackpot') resTitle.style.color = '#ffb800';
            else if(prize.class === 'rare') resTitle.style.color = '#a855f7';
            else resTitle.style.color = '#3b82f6';

            resultOverlay.classList.add('active');
            
            if (tg.HapticFeedback) {
                if(prize.class === 'jackpot') tg.HapticFeedback.notificationOccurred('success');
                else tg.HapticFeedback.impactOccurred('medium');
            }
        }

        document.getElementById('close-result').addEventListener('click', () => {
            resultOverlay.classList.remove('active');
            
            setTimeout(() => {
                rouletteEl.style.display = 'none';
                caseIcon.style.display = 'flex';
                spinBtn.disabled = false;
                isSpinning = false;
            }, 300);
        });

        updateBalance();
    </script>
</body>
</html>
