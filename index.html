<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stars Battle</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Стили остаются прежними, я лишь добавил .loading для кнопок */
        :root { --bg-color: #121214; --card-bg: #1e1e24; --star-color: #ffb800; --star-glow: rgba(255, 184, 0, 0.3); --text-main: #ffffff; --text-muted: #8b8b93; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; user-select: none; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: var(--card-bg); border-bottom: 1px solid #2a2a35; }
        .balance-container { display: flex; align-items: center; gap: 10px; background: #2a2a35; padding: 5px 15px; border-radius: 20px; border: 1px solid #444; }
        .balance { font-size: 20px; font-weight: bold; color: var(--star-color); }
        .btn-add { background: var(--star-color); color: #000; border: none; width: 30px; height: 30px; border-radius: 50%; font-size: 20px; font-weight: bold; cursor: pointer; }
        .content { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 80px; display: none; }
        .content.active { display: block; }
        .cases-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .case-card { background: var(--card-bg); border-radius: 15px; padding: 20px; text-align: center; border: 1px solid #2a2a35; cursor: pointer; position: relative; }
        .case-card.common { border-color: #3b82f6; } .case-card.rare { border-color: #a855f7; } .case-card.legendary { border-color: var(--star-color); }
        .case-emoji { font-size: 60px; margin-bottom: 10px; } .case-name { font-size: 16px; font-weight: bold; } .case-price { font-size: 14px; color: var(--star-color); }
        .inventory-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .inv-item { background: var(--card-bg); border-radius: 10px; padding: 10px; text-align: center; border: 1px solid #2a2a35; }
        .inv-emoji { font-size: 40px; } .inv-name { font-size: 12px; color: var(--text-muted); }
        .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; height: 70px; background: var(--card-bg); border-top: 1px solid #2a2a35; display: flex; justify-content: space-around; align-items: center; z-index: 10; }
        .nav-item { color: var(--text-muted); font-size: 12px; cursor: pointer; text-align: center; } .nav-item.active { color: var(--star-color); }
        .nav-icon { font-size: 24px; }
        
        .game-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(18, 18, 20, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 50; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .game-overlay.active { opacity: 1; pointer-events: auto; }
        
        /* НОРМАЛЬНАЯ РУЛЕТКА */
        .roulette-container { width: 100%; height: 120px; background: var(--card-bg); border-radius: 15px; overflow: hidden; position: relative; border: 1px solid #2a2a35; margin: 30px 0; }
        .roulette-container::before { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; background: var(--star-color); transform: translateX(-50%); z-index: 10; box-shadow: 0 0 15px var(--star-color); }
        .roulette-track { display: flex; height: 100%; align-items: center; position: absolute; left: 0; }
        .roulette-item { width: 100px; height: 90px; margin: 0 10px; background: #2a2a35; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; border-bottom: 3px solid #555; }
        .roulette-item.nft { border-bottom-color: #a855f7; }
        .roulette-item .emoji { font-size: 30px; } .roulette-item .price { font-size: 12px; font-weight: bold; color: var(--star-color); }

        .btn { background: linear-gradient(90deg, #ffb800, #ff9500); color: #000; border: none; padding: 16px; font-size: 18px; font-weight: bold; border-radius: 12px; width: 100%; max-width: 320px; cursor: pointer; }
        .result-card { background: var(--card-bg); padding: 30px; border-radius: 25px; text-align: center; border: 2px solid var(--star-color); display: none; width: 90%; max-width: 300px; }
        .result-card.active { display: block; }
    </style>
</head>
<body>

    <div class="header">
        <div id="username" style="font-weight: bold;">Игрок</div>
        <div class="balance-container">
            <div class="balance" id="balance-amount">Загрузка...</div>
            <div style="font-size: 20px;">⭐</div>
            <button class="btn-add" onclick="topUp()">+</button>
        </div>
    </div>

    <div class="content active" id="tab-game">
        <h2 style="margin-bottom: 15px; font-size: 20px;">Выбери кейс</h2>
        <div class="cases-grid">
            <div class="case-card common" onclick="startGame('common')"><div class="case-emoji">📦</div><div class="case-name">Стартовый</div><div class="case-price">10 ⭐</div></div>
            <div class="case-card rare" onclick="startGame('rare')"><div class="case-emoji">🎁</div><div class="case-name">Редкий</div><div class="case-price">50 ⭐</div></div>
            <div class="case-card legendary" onclick="startGame('legendary')"><div class="case-emoji">👑</div><div class="case-name">Легендарный</div><div class="case-price">150 ⭐</div></div>
        </div>
    </div>

    <div class="content" id="tab-inventory">
        <h2 style="margin-bottom: 15px; font-size: 20px;">Твой Инвентарь</h2>
        <div class="inventory-grid" id="inventory-list"></div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('game')" id="nav-game"><div class="nav-icon">🎮</div><div>Игра</div></div>
        <div class="nav-item" onclick="switchTab('inventory')" id="nav-inventory"><div class="nav-icon">🎒</div><div>Инвентарь</div></div>
    </div>

    <div class="game-overlay" id="game-overlay">
        <h2 id="current-case-name" style="color: var(--star-color);">Загрузка...</h2>
        <div class="roulette-container" id="roulette"><div class="roulette-track" id="track"></div></div>
        <div class="result-card" id="result-card">
            <div style="font-size: 60px; margin-bottom: 10px;" id="res-emoji">⭐</div>
            <div style="font-size: 20px; color: var(--star-color);" id="res-title">Победа!</div>
            <div style="font-size: 16px; color: var(--text-muted); margin-bottom: 20px;" id="res-price">+10 ⭐</div>
            <button class="btn" onclick="closeGame()">Забрать</button>
        </div>
    </div>

    <script>
        // ВАЖНО: Замените этот IP на IP вашего сервера, где запущен Python!
        // Если запускаете локально, оставьте localhost, но Telegram не сможет к нему подключиться.
        // Для теста в браузере: http://localhost:8080
        const API_URL = "https://myminiapp.wisp.uno"; 

        let tg = window.Telegram.WebApp;
        tg.expand(); 
        const userId = tg.initDataUnsafe?.user?.id || 123456789; // 123 для теста в браузере
        
        let balance = 0;
        let inventory = [];

        if (tg.initDataUnsafe?.user) document.getElementById('username').innerText = tg.initDataUnsafe.user.first_name;

        // Призы для отрисовки рулетки (должны совпадать с сервером)
        const CASE_PRIZES = {
            common: [ {e:"⭐",v:1}, {e:"🌟",v:5}, {e:"💫",v:15}, {e:"🧸",v:"NFT"} ],
            rare: [ {e:"⭐",v:10}, {e:"🌟",v:30}, {e:"💫",v:80}, {e:"💍",v:"NFT"}, {e:"🌹",v:"NFT"} ],
            legendary: [ {e:"⭐",v:50}, {e:"🌟",v:150}, {e:"🚀",v:"NFT"}, {e:"🏆",v:"NFT"}, {e:"👑",v:"NFT"} ]
        };

        // 1. СИНХРОНИЗАЦИЯ БАЛАНСА
        async function syncBalance() {
            try {
                const res = await fetch(`${API_URL}/api/balance?user_id=${userId}`);
                const data = await res.json();
                balance = data.balance;
                inventory = data.inventory || [];
                document.getElementById('balance-amount').innerText = balance;
                renderInventory();
            } catch (e) {
                console.error("Ошибка синхронизации", e);
                document.getElementById('balance-amount').innerText = "Ошибка сети";
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            document.getElementById(`nav-${tab}`).classList.add('active');
            if(tab === 'inventory') renderInventory();
        }

        // 2. ИГРА И РУЛЕТКА
        let isSpinning = false;

        async function startGame(caseType) {
            if (isSpinning) return;

            isSpinning = true;
            document.getElementById('game-overlay').classList.add('active');
            document.getElementById('current-case-name').innerText = "Запрос к серверу...";
            document.getElementById('roulette').style.display = 'block';
            document.getElementById('result-card').classList.remove('active');

            try {
                // Отправляем запрос на сервер: "Крути кейс!"
                const res = await fetch(`${API_URL}/api/spin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, case_type: caseType })
                });
                
                const data = await res.json();
                
                if (data.error) {
                    tg.showAlert(data.error);
                    closeGame();
                    return;
                }

                // Сервер вернул выигрыш и новый баланс
                const winningPrize = data.win;
                balance = data.new_balance;
                document.getElementById('balance-amount').innerText = balance;
                
                // Запускаем визуал
                document.getElementById('current-case-name').innerText = "Крутим...";
                runRouletteAnimation(caseType, winningPrize);

            } catch (e) {
                tg.showAlert("Ошибка соединения с сервером");
                closeGame();
            }
        }

        function runRouletteAnimation(caseType, winPrize) {
            const trackEl = document.getElementById('track');
            const prizes = CASE_PRIZES[caseType];
            trackEl.innerHTML = '';
            
            // Генерируем 50 элементов
            for (let i = 0; i < 50; i++) {
                const p = prizes[Math.floor(Math.random() * prizes.length)];
                const itemClass = p.v === "NFT" ? 'nft' : '';
                trackEl.innerHTML += `<div class="roulette-item ${itemClass}"><div class="emoji">${p.e}</div><div class="price">${p.v === "NFT" ? 'NFT' : p.v+'⭐'}</div></div>`;
            }

            // Вставляем выигрыш на 45-ю позицию
            const winEl = document.createElement('div');
            const isNft = winPrize.isNft;
            winEl.className = `roulette-item ${isNft ? 'nft' : ''}`;
            winEl.innerHTML = `<div class="emoji">${winPrize.emoji}</div><div class="price">${isNft ? 'NFT' : winPrize.value+'⭐'}</div>`;
            trackEl.replaceChild(winEl, trackEl.children[45]);

            // МАТЕМАТИКА РУЛЕТКИ (идеальное центрирование)
            const itemWidth = 120; // 100px ширина + 20px отступы
            const containerWidth = document.getElementById('roulette').offsetWidth;
            
            // Вычисляем, насколько сдвинуть ленту, чтобы 45-й элемент встал ровно по центру
            // Центр контейнера минус половина ширины элемента минус позиция элемента
            const centerOffset = (containerWidth / 2) - (itemWidth / 2);
            const translateX = -(45 * itemWidth) + centerOffset;

            trackEl.style.transition = 'none';
            trackEl.style.transform = `translateX(0px)`;

            setTimeout(() => {
                trackEl.style.transition = 'transform 4s cubic-bezier(0.15, 0.9, 0.2, 1)';
                trackEl.style.transform = `translateX(${translateX}px)`;

                setTimeout(() => {
                    showResult(winPrize);
                    // Обновляем инвентарь, если выпал NFT
                    if (isNft) syncBalance();
                }, 4100);
            }, 50);
        }

        function showResult(item) {
            document.getElementById('roulette').style.display = 'none';
            const resCard = document.getElementById('result-card');
            document.getElementById('res-emoji').innerText = item.emoji;
            document.getElementById('res-title').innerText = item.name;
            document.getElementById('res-price').innerText = item.isNft ? "Добавлено в инвентарь!" : `+${item.value} ⭐`;
            resCard.classList.add('active');
            if (item.isNft && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }

        function closeGame() {
            isSpinning = false;
            document.getElementById('game-overlay').classList.remove('active');
        }

        // 3. ИНВЕНТАРЬ
        function renderInventory() {
            const list = document.getElementById('inventory-list');
            list.innerHTML = '';
            if (inventory.length === 0) {
                list.innerHTML = '<div style="grid-column: span 3; text-align: center; color: gray;">Пусто</div>';
                return;
            }
            [...inventory].reverse().forEach(item => {
                list.innerHTML += `<div class="inv-item"><div class="inv-emoji">${item.emoji}</div><div class="inv-name">${item.name}</div></div>`;
            });
        }

        // 4. ПОПОЛНЕНИЕ (Через бота)
        function topUp() {
            tg.showPopup({
                title: 'Пополнение', message: 'Выберите сумму:',
                buttons: [{id: '100', type: 'default', text: '100 ⭐'}, {id: '500', type: 'default', text: '500 ⭐'}, {id: 'cancel', type: 'cancel'}]
            }, function(buttonId) {
                if (buttonId !== 'cancel') {
                    // Здесь используем sendData, так как бот должен выставить счет
                    tg.sendData(JSON.stringify({ action: 'topup', amount: parseInt(buttonId) }));
                }
            });
        }

        // ЗАПУСК ПРИ ЗАГРУЗКЕ
        syncBalance();
    </script>
</body>
</html>
